name: Mirror to GitLab

on:
  push:
    branches: [ "**" ]

jobs:
  to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: 'git@gitlab.com:ecomms1/ecomms-productservice.git'
          ssh_private_key: ${{ secrets.GITLAB_TOKEN }}