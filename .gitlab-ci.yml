workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "devops" || $CI_COMMIT_BRANCH == "main")'
    - when: never

stages:
  - build

variables:
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build_test_mr:
  stage: build
  tags:
    - dell-local

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  script:
    - echo "=== Product Service Merge Request CI ==="
    - echo "Source: $CI_PIPELINE_SOURCE"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "=== Building Product Service image ==="
    - docker build -t "$IMAGE_SHA" .
    - echo "=== Testing Product Service container ==="
    - docker run --rm "$IMAGE_SHA" php artisan --version
    - docker run --rm "$IMAGE_SHA" php artisan route:list
    - echo "=== MR build and tests passed ==="
    - echo "Image was NOT pushed."

build_test_push:
  stage: build
  tags:
    - dell-local

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "devops" || $CI_COMMIT_BRANCH == "main")'

  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - echo "=== Product Service Branch CI ==="
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "=== Building Product Service image ==="
    - docker build -t "$IMAGE_SHA" .
    - echo "=== Testing Product Service container ==="
    - docker run --rm "$IMAGE_SHA" php artisan --version
    - docker run --rm "$IMAGE_SHA" php artisan route:list
    - echo "=== Selecting branch image tag ==="
    - 'if [ "$CI_COMMIT_BRANCH" = "devops" ]; then IMAGE_BRANCH="$CI_REGISTRY_IMAGE:devops"; else IMAGE_BRANCH="$CI_REGISTRY_IMAGE:main"; fi'
    - echo "Branch image: $IMAGE_BRANCH"
    - echo "=== Tagging branch image ==="
    - docker tag "$IMAGE_SHA" "$IMAGE_BRANCH"
    - echo "=== Pushing SHA image ==="
    - docker push "$IMAGE_SHA"
    - echo "=== Pushing branch image ==="
    - docker push "$IMAGE_BRANCH"

  after_script:
    - docker logout "$CI_REGISTRY" || true
